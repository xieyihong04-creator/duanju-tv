name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest -PskipLiveNetworkTests

      - name: Assemble Release (signed)
        env:
          DJ_storeFile: ${{ env.KEYSTORE_PATH }}
          DJ_storePassword: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          DJ_keyAlias: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          DJ_keyPassword: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Verifying: $APK"
          apksigner verify --print-certs "$APK"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "红果完整版（App签名通道+网页兜底）+ 设置页切换红果源"