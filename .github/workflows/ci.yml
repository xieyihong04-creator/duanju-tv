name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        # -PskipLiveNetworkTests：第三方 CMS 源会 403 机房 IP，live 用例仅在本地跑
        run: ./gradlew --no-daemon :app:testDebugUnitTest -PskipLiveNetworkTests

      - name: Assemble release
        # CI 无签名凭据，产出未签名 APK；本地配置 keystore.properties 后为已签名版本
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
